<div class="container mt-5">
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="text-primary">E-commerce de Eletrônicos e Jogos</h2>
      <p class="text-muted">Painel de gerenciamento de estoque</p>
    </div>
  </div>

  <div class="card shadow-sm mb-5">
    <div class="card-body">
      <h4 class="card-title mb-3">Cadastrar Novo Produto</h4>
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label fw-bold">Nome do Equipamento/Jogo</label>
          <input type="text" class="form-control" [(ngModel)]="novoProduto.nome" placeholder="Ex: Headset Gamer">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Preço (R$)</label>
          <input type="number" class="form-control" [(ngModel)]="novoProduto.preco" placeholder="0.00">
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100" (click)="adicionarProduto()">
            Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Produtos Cadastrados</h4>
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col" style="width: 10%">ID</th>
              <th scope="col" style="width: 50%">Produto</th>
              <th scope="col" style="width: 20%">Preço</th>
              <th scope="col" style="width: 20%" class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let produto of produtos">
              <td>{{ produto.id }}</td>
              <td class="fw-semibold">{{ produto.nome }}</td>
              <td>R$ {{ produto.preco }}</td>
              <td class="text-center">
                <button class="btn btn-danger btn-sm" (click)="excluirProduto(produto.id)">
                  Excluir
                </button>
              </td>
            </tr>
            <tr *ngIf="produtos.length === 0">
              <td colspan="4" class="text-center text-muted py-3">
                Nenhum produto cadastrado no momento.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
